name: Weekly Maintenance

on:
  schedule:
    - cron: "0 9 * * 1" # Jeden Montag um 09:00 UTC
  workflow_dispatch: # Ermöglicht manuellen Test-Start per Klick

jobs:
  weekly:
    uses: kamod-ch/.github/.github/workflows/weekly-ai-maintenance.yml@main
    with:
      auto_merge: true
      # Optional repo-spezifische Hinweise:
      # custom_instructions: "Führe zusätzlich `pnpm docs:build` aus."
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
