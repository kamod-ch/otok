name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  otok-benchmark:
    name: Otok self-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run Otok benchmark
        run: pnpm bench:otok
        env:
          BENCH_GIT_SHA: ${{ github.sha }}

      - name: Budget check
        run: pnpm budget:check

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/latest.json
