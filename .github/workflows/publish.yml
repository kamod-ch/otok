name: Publish packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build

      - name: Pack check
        run: pnpm pack:check

      - name: Install Playwright browsers
        run: pnpm --filter playground exec playwright install --with-deps chromium firefox webkit

      - name: E2E
        run: pnpm test:e2e

      - name: Configure npm registry authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN repository secret is missing or empty. Create an npm automation token with publish access to the otok packages and add it as the NPM_TOKEN secret in GitHub repository settings." >&2
            exit 1
          fi

          npmrc_path="${RUNNER_TEMP}/.npmrc"
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            echo "access=public"
          } > "${npmrc_path}"

          echo "NPM_CONFIG_USERCONFIG=${npmrc_path}" >> "${GITHUB_ENV}"
          echo "npm_config_userconfig=${npmrc_path}" >> "${GITHUB_ENV}"
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version packages and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if find .changeset -maxdepth 1 -name "*.md" | grep -q .; then
            pnpm version-packages

            if ! git diff --quiet; then
              git add .
              git commit -m "chore: version packages"
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi

          pnpm release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_provenance: true
          npm_config_access: public
