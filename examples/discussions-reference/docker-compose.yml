services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otok
      POSTGRES_PASSWORD: otok
      POSTGRES_DB: discussions_reference
    ports:
      - "5437:5432"
    volumes:
      - discussions_ref_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otok -d discussions_reference"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  discussions_ref_pg_data:
