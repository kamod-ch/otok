services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otok
      POSTGRES_PASSWORD: otok
      POSTGRES_DB: crm_swiss
    ports:
      - "5433:5432"
    volumes:
      - crm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otok -d crm_swiss"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crm_pg_data:
