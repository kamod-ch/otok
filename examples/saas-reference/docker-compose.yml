services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otok
      POSTGRES_PASSWORD: otok
      POSTGRES_DB: saas_reference
    ports:
      - "5434:5432"
    volumes:
      - saas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otok -d saas_reference"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saas_pg_data:
